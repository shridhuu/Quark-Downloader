[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quark-downloader"
version = "0.1.0"
description = "Local-first resumable downloader for authorized Quark Cloud Drive shares"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shridhuu"}]
keywords = ["quark", "cloud-drive", "downloader", "resumable", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "playwright>=1.43",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4",
]

[project.scripts]
quarkdl = "quarkdl.cli:main"

[project.urls]
Homepage = "https://github.com/shridhuu/Quark-Downloader"
Repository = "https://github.com/shridhuu/Quark-Downloader"
Issues = "https://github.com/shridhuu/Quark-Downloader/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/quarkdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
